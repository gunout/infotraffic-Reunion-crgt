<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Infotrafic Réunion - Données officielles en direct</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="description" content="Information routière officielle en temps réel à La Réunion - Webcams, bouchons, travaux">
  <meta name="theme-color" content="#002654">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Roboto Mono', monospace; background: #0a0a0a; color: #fff; min-height: 100vh; padding: 10px; }
    .flag-bar { height: 4px; background: linear-gradient(90deg, #002654 0%, #002654 33.33%, #fff 33.33%, #fff 66.66%, #ED2939 66.66%, #ED2939 100%); margin-bottom: 10px; border-radius: 5px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 12px 15px; background: linear-gradient(135deg, #002654 0%, #fff 50%, #ED2939 100%); border: 1px solid #fff; box-shadow: 0 0 20px rgba(255,255,255,0.3); border-radius: 10px; flex-wrap: wrap; gap: 10px; }
    .logo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .logo h1 { font-size: 1.3em; color: #fff; text-shadow: 2px 2px 0 #002654, -2px -2px 0 #ED2939; }
    .badge { background: #fff; color: #002654; padding: 3px 10px; border-radius: 30px; font-weight: bold; font-size: 0.8em; border: 1px solid #ED2939; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .stat-item { display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 30px; font-size: 0.8em; }
    .stat-item.blue { border: 1px solid #002654; color: #002654; background: rgba(255,255,255,0.9); }
    .stat-item.red { border: 1px solid #ED2939; color: #ED2939; background: rgba(255,255,255,0.9); }
    .stat-item.white { border: 1px solid #fff; color: #fff; background: rgba(0,0,0,0.5); }
    .main-container { display: flex; gap: 15px; min-height: 400px; }
    .webcam-section { flex: 2; display: flex; flex-direction: column; background: linear-gradient(145deg, #001a3a 0%, #fff 50%, #3a0f0f 100%); border: 2px solid #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 0 30px rgba(0,38,84,0.5); }
    .webcam-header { padding: 12px; background: linear-gradient(90deg, #002654 0%, #fff 50%, #ED2939 100%); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .webcam-title { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #fff; text-shadow: 2px 2px 0 #002654; font-size: 0.9em; }
    .live-indicator { display: flex; align-items: center; gap: 5px; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 30px; font-size: 0.75em; color: #fff; }
    .live-dot { width: 8px; height: 8px; background: #ED2939; border-radius: 50%; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } }
    .webcam-container { flex: 1; position: relative; background: #000; min-height: 180px; display: flex; justify-content: center; align-items: center; }
    .webcam-container img { width: 100%; height: 100%; object-fit: contain; }
    .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(0,38,84,0.9) 0%, rgba(255,255,255,0.9) 50%, rgba(237,41,57,0.9) 100%); display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 10px; z-index: 10; text-align: center; padding: 15px; }
    .spinner { width: 40px; height: 40px; border: 3px solid #fff; border-top-color: #002654; border-right-color: #ED2939; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .webcam-info { position: absolute; bottom: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; background: linear-gradient(90deg, #002654 0%, transparent 50%, #ED2939 100%); padding: 6px 10px; border: 1px solid #fff; border-radius: 5px; color: #fff; font-weight: bold; z-index: 15; font-size: 0.8em; flex-wrap: wrap; gap: 5px; }
    .webcam-controls { padding: 12px; background: linear-gradient(145deg, #002654 0%, #fff 50%, #ED2939 100%); border-top: 1px solid #fff; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .btn { background: transparent; border: 2px solid #fff; color: #fff; padding: 6px 12px; cursor: pointer; font-family: inherit; font-size: 0.8em; transition: all 0.3s; display: flex; align-items: center; gap: 4px; font-weight: bold; text-shadow: 1px 1px 0 #002654; border-radius: 6px; }
    .btn:hover { background: #fff; color: #002654; border-color: #ED2939; box-shadow: 0 0 20px #fff; }
    .sidebar { flex: 1; display: flex; flex-direction: column; background: linear-gradient(145deg, #001a3a 0%, #fff 50%, #2a0a0a 100%); border: 2px solid #fff; border-radius: 10px; overflow: hidden; min-width: 280px; box-shadow: 0 0 30px rgba(237,41,57,0.3); }
    .sidebar-header { padding: 12px; background: linear-gradient(90deg, #002654 0%, #fff 50%, #ED2939 100%); }
    .sidebar-header span { color: #fff; font-weight: bold; text-shadow: 2px 2px 0 #002654; font-size: 0.9em; }
    .search-box { width: 100%; padding: 8px; margin-top: 8px; background: rgba(255,255,255,0.9); border: 2px solid #002654; color: #002654; font-family: inherit; border-radius: 5px; font-weight: bold; font-size: 0.8em; }
    .category-filters { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; background: rgba(0,0,0,0.2); }
    .category-btn { background: transparent; border: 1px solid #fff; color: #fff; padding: 4px 6px; border-radius: 20px; font-size: 0.6em; cursor: pointer; transition: all 0.3s; flex: 1 1 auto; min-width: 60px; }
    .category-btn:hover, .category-btn.active { background: #ED2939; border-color: #ED2939; }
    .sidebar-tabs { display: flex; border-bottom: 2px solid #fff; flex-wrap: wrap; }
    .tab { flex: 1; padding: 10px 3px; text-align: center; background: none; border: none; color: #fff; cursor: pointer; font-family: inherit; font-size: 0.75em; font-weight: bold; text-shadow: 1px 1px 0 #002654; min-width: 70px; }
    .tab.active { background: linear-gradient(90deg, #002654 0%, #ED2939 100%); }
    .tab-content { flex: 1; overflow-y: auto; padding: 12px; max-height: 350px; }
    .webcam-list { display: flex; flex-direction: column; gap: 8px; }
    .webcam-item { background: linear-gradient(145deg, rgba(0,38,84,0.1) 0%, rgba(255,255,255,0.2) 50%, rgba(237,41,57,0.1) 100%); border: 1px solid #002654; padding: 8px; cursor: pointer; transition: all 0.3s; display: flex; justify-content: space-between; align-items: center; border-radius: 5px; font-size: 0.8em; }
    .webcam-item:hover { transform: translateX(-3px); border-color: #ED2939; box-shadow: 0 0 10px #ED2939; }
    .webcam-item.active { border: 2px solid #ED2939; background: linear-gradient(145deg, #002654 0%, #fff 50%, #ED2939 100%); }
    .zone-tag { font-size: 0.65em; padding: 2px 5px; background: #002654; color: #fff; border-radius: 20px; white-space: nowrap; }
    .incident-list { display: flex; flex-direction: column; gap: 8px; }
    .incident-card { background: linear-gradient(145deg, rgba(0,38,84,0.2) 0%, rgba(255,255,255,0.3) 50%, rgba(237,41,57,0.2) 100%); border-left: 4px solid; padding: 8px; cursor: pointer; transition: all 0.3s; border-radius: 0 5px 5px 0; font-size: 0.8em; }
    .incident-card:hover { transform: translateX(-3px); box-shadow: 0 0 10px #fff; }
    .incident-title { display: flex; align-items: center; gap: 5px; font-weight: bold; margin-bottom: 4px; color: #002654; font-size: 0.85em; }
    .incident-desc { color: #000; font-size: 0.8em; margin: 4px 0; line-height: 1.3; }
    .incident-meta { display: flex; justify-content: space-between; color: #ED2939; font-size: 0.7em; margin-top: 5px; font-weight: bold; }
    .incident-source { font-size: 0.6em; color: #002654; margin-top: 4px; font-style: italic; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 15px; }
    .stat-card { background: rgba(255,255,255,0.1); padding: 6px; border-radius: 5px; text-align: center; }
    .stat-number { font-size: 1.1em; font-weight: bold; color: #ED2939; }
    .stat-label { font-size: 0.6em; color: #fff; }
    .map-container { margin-top: 15px; height: 200px; border: 3px solid #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 0 30px rgba(0,38,84,0.5); }
    #map { height: 100%; width: 100%; }
    .footer { margin-top: 15px; padding: 8px 15px; background: linear-gradient(90deg, #002654 0%, #fff 50%, #ED2939 100%); border-radius: 10px; display: flex; justify-content: space-between; align-items: center; color: #002654; font-weight: bold; flex-wrap: wrap; gap: 8px; font-size: 0.8em; }
    .source-item { display: flex; align-items: center; gap: 5px; }
    .source-item a { color: #002654; text-decoration: none; border-bottom: 1px dotted #ED2939; }
    .last-update { color: #ED2939; font-weight: bold; }
    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .sidebar { min-width: 100%; }
      .stats { justify-content: center; width: 100%; }
      .webcam-container { min-height: 200px; }
      .map-container { height: 180px; }
    }
  </style>
</head>
<body>
  <div class="flag-bar"></div>

  <div class="header">
    <div class="logo">
      <h1>INFOTRAFIC RÉUNION</h1>
      <span class="badge">DIRECT</span>
    </div>
    <div class="stats">
      <div class="stat-item blue"><span class="material-icons" style="font-size:16px;">videocam</span><span id="camCount">12</span></div>
      <div class="stat-item red"><span class="material-icons" style="font-size:16px;">warning</span><span id="incidentCount">0</span></div>
      <div class="stat-item white"><span class="material-icons" style="font-size:16px;">schedule</span><span id="liveTime">--:--</span></div>
    </div>
  </div>

  <div class="main-container">
    <div class="webcam-section">
      <div class="webcam-header">
        <div class="webcam-title"><span class="material-icons" style="font-size:16px;">live_tv</span><span id="webcamName">WEBCAM</span></div>
        <div class="live-indicator"><span class="live-dot"></span><span>DRR · InfoTrafic 974</span></div>
      </div>
      <div class="webcam-container" id="webcamContainer">
        <div class="loading-overlay" id="loadingOverlay">
          <span class="material-icons" style="font-size:48px;color:#fff;">open_in_new</span>
          <div style="color:#fff;font-weight:bold;font-size:0.9em;">Caméra disponible via l'application InfoTrafic 974</div>
          <a id="webcamLink" href="https://www.reunion.fr/organisez/webcams/" target="_blank" rel="noopener" style="margin-top:8px;padding:6px 14px;background:#002654;color:#fff;border:2px solid #fff;border-radius:6px;text-decoration:none;font-size:0.8em;font-weight:bold;">OUVRIR LES WEBCAMS →</a>
        </div>
        <div class="webcam-info">
          <span id="locationDisplay">Localisation: -</span>
          <span id="zoneDisplay">Zone: -</span>
        </div>
      </div>
      <div class="webcam-controls">
        <button class="btn" id="prevBtn"><span class="material-icons" style="font-size:16px;">chevron_left</span>PRÉC</button>
        <button class="btn" id="refreshBtn"><span class="material-icons" style="font-size:16px;">refresh</span>ACTU</button>
        <button class="btn" id="nextBtn">SUIV<span class="material-icons" style="font-size:16px;">chevron_right</span></button>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-header">
        <div style="display:flex;align-items:center;gap:5px;"><span class="material-icons" style="font-size:16px;">info</span><span>INFOS TRAFIC</span></div>
        <input type="text" class="search-box" id="searchInput" placeholder="Rechercher...">
      </div>
      <div class="category-filters" id="categoryFilters"></div>
      <div class="sidebar-tabs">
        <button class="tab active" onclick="window.switchTab('incidents')">⚠️ INCID</button>
        <button class="tab" onclick="window.switchTab('stats')">📊 STATS</button>
        <button class="tab" onclick="window.switchTab('webcams')">📹 WEBCAMS</button>
      </div>
      <div class="tab-content" id="tabContent"></div>
    </div>
  </div>

  <div class="map-container"><div id="map"></div></div>

  <div class="footer">
    <div class="source-item"><span>📹</span><a href="https://play.google.com/store/apps/details?id=fr.squirrel.infotraffic974" target="_blank">InfoTrafic 974 · DRR Région Réunion</a></div>
    <div class="last-update" id="lastUpdate">--:--</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script>
  (function() {
    'use strict';

    const OEDB_API = 'https://api.openeventdatabase.org/event';
    const REUNION_BBOX = '55.2,-21.4,55.9,-20.8';

    // ============================================
    // WEBCAMS OFFICIELLES DRR (via InfoTrafic 974)
    // Pas d'URL directe — redirection vers l'app/site officiel
    // ============================================
    const WEBCAMS = [
      { id: 'sainte_marie', name: 'Sainte-Marie', zone: 'Nord', desc: 'Sainte-Marie', coords: [-20.8969, 55.5501], url: 'https://play.google.com/store/apps/details?id=fr.squirrel.infotraffic974' },
      { id: 'st_denis_jamaique', name: 'Saint-Denis Jamaique', zone: 'Nord', desc: 'Saint-Denis Jamaique', coords: [-20.8821, 55.4503], url: 'https://play.google.com/store/apps/details?id=fr.squirrel.infotraffic974' },
      { id: 'gillot', name: 'Échangeur de Gillot', zone: 'Nord', desc: 'Échangeur de Gillot', coords: [-20.8912, 55.5217], url: 'https://play.google.com/store/apps/details?id=fr.squirrel.infotraffic974' },
      { id: 'st_denis_ouest', name: 'Entrée Ouest Saint-Denis', zone: 'Nord', desc: 'Entrée Ouest Saint-Denis', coords: [-20.8789, 55.4321], url: 'https://play.google.com/store/apps/details?id=fr.squirrel.infotraffic974' },
      { id: 'grande_chaloupe', name: 'Grande Chaloupe', zone: 'Nord-Ouest', desc: 'Grande Chaloupe', coords: [-20.9067, 55.3982], url: 'https://play.google.com/store/apps/details?id=fr.squirrel.infotraffic974' },
      { id: 'la_possession', name: 'La Possession', zone: 'Ouest', desc: 'La Possession', coords: [-20.9278, 55.3354], url: 'https://play.google.com/store/apps/details?id=fr.squirrel.infotraffic974' },
      { id: 'saint_paul', name: 'Saint-Paul', zone: 'Ouest', desc: 'Saint-Paul', coords: [-20.9967, 55.2821], url: 'https://play.google.com/store/apps/details?id=fr.squirrel.infotraffic974' },
      { id: 'viaduc_bernica', name: 'Viaduc Bernica', zone: 'Ouest', desc: 'Viaduc Bernica', coords: [-21.0103, 55.2718], url: 'https://play.google.com/store/apps/details?id=fr.squirrel.infotraffic974' },
      { id: 'trois_bassins', name: 'Trois Bassins', zone: 'Ouest', desc: 'Trois Bassins', coords: [-21.0812, 55.2598], url: 'https://play.google.com/store/apps/details?id=fr.squirrel.infotraffic974' },
      { id: 'saint_leu', name: 'Saint-Leu', zone: 'Ouest', desc: 'Saint-Leu', coords: [-21.1534, 55.2789], url: 'https://play.google.com/store/apps/details?id=fr.squirrel.infotraffic974' },
      { id: 'pierrefonds', name: 'Pierrefonds', zone: 'Sud', desc: 'Pierrefonds', coords: [-21.2867, 55.4212], url: 'https://play.google.com/store/apps/details?id=fr.squirrel.infotraffic974' },
      { id: 'azalees', name: 'Azalees', zone: 'Sud', desc: 'Azalees', coords: [-21.3124, 55.4678], url: 'https://play.google.com/store/apps/details?id=fr.squirrel.infotraffic974' }
    ];

    const CATEGORIES = [
      { id: 'accident', name: 'Accidents', color: '#ED2939', icon: 'warning' },
      { id: 'traffic_jam', name: 'Bouchons', color: '#FFA500', icon: 'traffic' },
      { id: 'roadworks', name: 'Travaux', color: '#002654', icon: 'construction' },
      { id: 'hazard', name: 'Dangers', color: '#FF4500', icon: 'warning' },
      { id: 'roadclosure', name: 'Fermetures', color: '#000000', icon: 'block' },
      { id: 'flood', name: 'Inondations', color: '#00CED1', icon: 'water' },
      { id: 'local_event', name: 'Événements', color: '#9370DB', icon: 'event' },
      { id: 'animal', name: 'Animaux', color: '#8B4513', icon: 'pets' }
    ];

    let currentIndex = 0;
    let map = null;
    let markers = [];
    let incidentMarkers = [];
    let allIncidents = {};

    const el = {
      webcamLink: document.getElementById('webcamLink'),
      webcamName: document.getElementById('webcamName'),
      locationDisplay: document.getElementById('locationDisplay'),
      zoneDisplay: document.getElementById('zoneDisplay'),
      camCount: document.getElementById('camCount'),
      incidentCount: document.getElementById('incidentCount'),
      liveTime: document.getElementById('liveTime'),
      lastUpdate: document.getElementById('lastUpdate'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      refreshBtn: document.getElementById('refreshBtn'),
      searchInput: document.getElementById('searchInput'),
      tabContent: document.getElementById('tabContent'),
      categoryFilters: document.getElementById('categoryFilters')
    };

    async function apiFetch(url) {
      try {
        const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return await r.json();
      } catch (e) { console.warn('Fetch:', e.message); return null; }
    }

    async function loadAllData() {
      const data = await apiFetch(OEDB_API + '?bbox=' + REUNION_BBOX + '&when=now&limit=500');
      if (!data || !data.features) { el.lastUpdate.textContent = 'Hors ligne'; return; }

      allIncidents = {};
      CATEGORIES.forEach(c => allIncidents[c.id] = []);
      let count = 0;

      data.features.forEach(ev => {
        const p = ev.properties || {};
        const g = ev.geometry;
        let lat = -21.1151, lng = 55.5364, lineCoords = null;

        if (g) {
          if (g.type === 'Point' && g.coordinates) { lng = g.coordinates[0]; lat = g.coordinates[1]; }
          else if (g.type === 'LineString' && g.coordinates && g.coordinates.length) {
            const m = Math.floor(g.coordinates.length / 2);
            lng = g.coordinates[m][0]; lat = g.coordinates[m][1];
            lineCoords = g.coordinates.map(c => [c[1], c[0]]);
          }
        }

        let cat = 'trafficolor';
        const w = (p.what || '').toLowerCase();
        if (w.includes('accident')) cat = 'accident';
        else if (w.includes('jam') || w.includes('bouchon') || w.includes('congestion')) cat = 'traffic_jam';
        else if (w.includes('roadwork') || w.includes('travaux') || w.includes('construction')) cat = 'roadworks';
        else if (w.includes('hazard') || w.includes('danger') || w.includes('obstacle')) cat = 'hazard';
        else if (w.includes('closure') || w.includes('ferm')) cat = 'roadclosure';
        else if (w.includes('flood') || w.includes('inondation')) cat = 'flood';
        else if (w.includes('event') || w.includes('manifestation')) cat = 'local_event';
        else if (w.includes('animal')) cat = 'animal';

        if (!allIncidents[cat]) allIncidents[cat] = [];
        allIncidents[cat].push({
          title: p.label || p.what || 'Incident',
          description: p.description || p.what || '',
          location: p.location_name || 'La Réunion',
          time: new Date(p.start || Date.now()).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
          coordinates: [lat, lng], lineCoords,
          source: p.source || 'OEDB'
        });
        count++;
      });

      el.incidentCount.textContent = count;
      el.lastUpdate.textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      updateIncidentMarkers();
      if (document.querySelector('.tab.active')?.textContent.includes('INCID')) displayAllIncidents();
    }

    function loadWebcam(index) {
      const cam = WEBCAMS[index];
      if (!cam) return;
      currentIndex = index;
      el.webcamName.textContent = cam.name.substring(0, 24);
      el.locationDisplay.textContent = '📍 ' + cam.desc;
      el.zoneDisplay.textContent = 'Zone: ' + cam.zone;
      el.webcamLink.href = cam.url;
      el.webcamLink.textContent = 'OUVRIR ' + cam.name.toUpperCase() + ' →';
      if (map) map.setView(cam.coords, 13);
      if (markers[index]) markers[index].openPopup();
    }

    function createCategoryFilters() {
      el.categoryFilters.innerHTML = CATEGORIES.map(c =>
        '<button class="category-btn" onclick="filterByCategory(\'' + c.id + '\')">' + c.name + '</button>'
      ).join('');
    }

    window.filterByCategory = function(id) {
      const inc = allIncidents[id] || [];
      if (inc.length) {
        const cat = CATEGORIES.find(c => c.id === id);
        el.tabContent.innerHTML = '<h3 style="color:' + cat.color + ';margin-bottom:10px;font-size:0.8em;">' + cat.name + '</h3><div class="incident-list">' +
          inc.map(i => renderIncident(i, cat)).join('') + '</div>';
      } else {
        el.tabContent.innerHTML = '<div style="text-align:center;padding:15px;color:#ED2939;font-size:0.8em;">Aucun incident</div>';
      }
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      if (event?.target) event.target.classList.add('active');
    };

    function renderIncident(inc, cat) {
      return '<div class="incident-card" style="border-left-color:' + cat.color + ';" onclick="focusLocation(' + inc.coordinates[0] + ',' + inc.coordinates[1] + ')">' +
        '<div class="incident-title"><span class="material-icons" style="font-size:16px;">' + cat.icon + '</span>' + esc(inc.title) + '</div>' +
        (inc.description ? '<div class="incident-desc">' + esc(inc.description.substring(0,80)) + '</div>' : '') +
        '<div class="incident-meta"><span>📍 ' + esc(inc.location) + '</span><span>🕒 ' + esc(inc.time) + '</span></div>' +
        '<div class="incident-source">Source: ' + esc(inc.source) + '</div></div>';
    }

    function esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

    function displayAllIncidents() {
      let html = '<div class="incident-list">', total = 0;
      Object.keys(allIncidents).forEach(k => {
        const arr = allIncidents[k];
        if (arr?.length) {
          const cat = CATEGORIES.find(c => c.id === k) || { id:k, name:k, color:'#888', icon:'info' };
          arr.forEach(i => { html += renderIncident(i, cat); total++; });
        }
      });
      if (!total) html += '<div style="text-align:center;padding:15px;color:#ED2939;font-size:0.8em;">Aucun incident</div>';
      el.tabContent.innerHTML = html + '</div>';
    }

    function displayStats() {
      const total = Object.values(allIncidents).reduce((s,a) => s + a.length, 0);
      let html = '<div class="stats-grid">';
      CATEGORIES.forEach(c => {
        const n = (allIncidents[c.id] || []).length;
        if (n) html += '<div class="stat-card" style="border-left:3px solid ' + c.color + ';"><div class="stat-number">' + n + '</div><div class="stat-label">' + c.name.substring(0,8) + '</div></div>';
      });
      html += '</div>';
      if (!total) html = '<div style="text-align:center;padding:15px;color:#ED2939;">Aucun incident</div>';
      else html += '<div style="text-align:center;margin-top:10px;"><span style="color:#ED2939;font-size:0.9em;">Total: ' + total + '</span></div>';
      el.tabContent.innerHTML = html;
    }

    // ============================================
    // CARTE — OpenStreetMap SANS API KEY
    // ============================================
    function initMap() {
      map = L.map('map', { center: [-21.1151, 55.5364], zoom: 10, zoomControl: false, attributionControl: false });
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      WEBCAMS.forEach((cam, i) => {
        const m = L.marker(cam.coords, {
          icon: L.divIcon({ className:'', html:'<div style="background:linear-gradient(135deg,#002654,#ED2939);width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px #fff;"></div>', iconSize:[12,12] })
        }).addTo(map);
        m.bindPopup('<b>📹 ' + cam.name + '</b><br>' + cam.zone);
        m.on('click', () => { currentIndex = i; loadWebcam(i); });
        markers.push(m);
      });
    }

    function updateIncidentMarkers() {
      if (!map) return;
      incidentMarkers.forEach(m => map.removeLayer(m));
      incidentMarkers = [];
      Object.keys(allIncidents).forEach(k => {
        const cat = CATEGORIES.find(c => c.id === k) || { id:k, color:'#888', icon:'info', name:k };
        allIncidents[k].forEach(inc => {
          const [lat, lng] = inc.coordinates;
          if (isNaN(lat) || isNaN(lng)) return;
          let popup = '<b style="color:' + cat.color + ';">' + esc(cat.name) + '</b><br><strong>' + esc(inc.title) + '</strong><br>' + esc(inc.description) + '<br>📍 ' + esc(inc.location) + '<br>🕒 ' + esc(inc.time);
          if (inc.lineCoords?.length > 1) {
            const poly = L.polyline(inc.lineCoords, { color:cat.color, weight:4, opacity:0.7, dashArray:'8,8' }).addTo(map);
            poly.bindPopup(popup); incidentMarkers.push(poly);
          } else {
            const mk = L.marker([lat,lng], { icon: L.divIcon({ className:'', html:'<span class="material-icons" style="color:' + cat.color + ';font-size:18px;filter:drop-shadow(0 0 6px ' + cat.color + ');">' + cat.icon + '</span>', iconSize:[18,18] }) }).addTo(map);
            mk.bindPopup(popup); incidentMarkers.push(mk);
          }
        });
      });
    }

    function nextCam() { currentIndex = (currentIndex + 1) % WEBCAMS.length; loadWebcam(currentIndex); }
    function prevCam() { currentIndex = (currentIndex - 1 + WEBCAMS.length) % WEBCAMS.length; loadWebcam(currentIndex); }

    window.selectWebcam = i => { currentIndex = i; loadWebcam(i); displayWebcamsList(); };
    window.focusLocation = (lat, lng) => { if (map) map.setView([lat, lng], 14); };
    window.switchTab = t => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      if (event?.target) event.target.classList.add('active');
      if (t === 'incidents') displayAllIncidents();
      else if (t === 'stats') displayStats();
      else displayWebcamsList();
    };

    function displayWebcamsList() {
      el.tabContent.innerHTML = '<div class="webcam-list">' + WEBCAMS.map((c,i) =>
        '<div class="webcam-item' + (i===currentIndex?' active':'') + '" onclick="selectWebcam(' + i + ')"><div><div><strong style="color:#002654;">' + esc(c.desc) + '</strong></div><div style="font-size:0.7em;color:#ED2939;margin-top:3px;">' + esc(c.zone) + '</div></div><span class="zone-tag">' + esc(c.zone) + '</span></div>'
      ).join('') + '</div>';
    }

    function startClock() {
      const tick = () => el.liveTime.textContent = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
      tick(); setInterval(tick, 1000);
    }

    function setupEvents() {
      el.prevBtn.addEventListener('click', prevCam);
      el.nextBtn.addEventListener('click', nextCam);
      el.refreshBtn.addEventListener('click', () => loadWebcam(currentIndex));
      el.searchInput.addEventListener('input', e => {
        if (!document.querySelector('.tab.active')?.textContent.includes('WEBCAMS')) return;
        const q = e.target.value.toLowerCase();
        const f = WEBCAMS.filter(c => c.name.toLowerCase().includes(q) || c.zone.toLowerCase().includes(q));
        el.tabContent.innerHTML = '<div class="webcam-list">' + f.map(c => {
          const i = WEBCAMS.findIndex(x => x.id === c.id);
          return '<div class="webcam-item' + (i===currentIndex?' active':'') + '" onclick="selectWebcam(' + i + ')"><div><div><strong style="color:#002654;">' + esc(c.desc) + '</strong></div><div style="font-size:0.7em;color:#ED2939;">' + esc(c.zone) + '</div></div><span class="zone-tag">' + esc(c.zone) + '</span></div>';
        }).join('') + '</div>';
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') prevCam();
        if (e.key === 'ArrowRight') nextCam();
      });
    }

    async function init() {
      el.camCount.textContent = WEBCAMS.length;
      initMap();
      loadWebcam(0);
      startClock();
      setupEvents();
      displayWebcamsList();
      createCategoryFilters();
      await loadAllData();
      setInterval(loadAllData, 60000);
    }

    document.addEventListener('DOMContentLoaded', init);
  })();
  </script>
</body>
</html>
