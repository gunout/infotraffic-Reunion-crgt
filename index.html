<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Infotrafic Réunion - Données officielles en direct</title>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="description" content="Information routière officielle en temps réel à La Réunion - Webcams D.E.E.R., bouchons, travaux">
  <meta name="keywords" content="webcam,trafic,La Réunion,DEER,bouchons,travaux,infotrafic">
  <meta name="author" content="Infotrafic Réunion">
  
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#002654">
  
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Roboto Mono', monospace;
      background: #0a0a0a;
      color: #ffffff;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }

    .flag-bar {
      height: 4px;
      background: linear-gradient(90deg, #002654 0%, #002654 33.33%, #ffffff 33.33%, #ffffff 66.66%, #ED2939 66.66%, #ED2939 100%);
      margin-bottom: 10px;
      border-radius: 5px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding: 12px 15px;
      background: linear-gradient(135deg, #002654 0%, #ffffff 50%, #ED2939 100%);
      border: 1px solid #ffffff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .logo h1 { font-size: 1.3em; color: #ffffff; text-shadow: 2px 2px 0 #002654, -2px -2px 0 #ED2939; }
    .badge { background: #ffffff; color: #002654; padding: 3px 10px; border-radius: 30px; font-weight: bold; font-size: 0.8em; border: 1px solid #ED2939; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 30px;
      font-size: 0.8em;
      backdrop-filter: blur(5px);
    }

    .stat-item.blue { border: 1px solid #002654; color: #002654; background: rgba(255, 255, 255, 0.9); }
    .stat-item.white { border: 1px solid #ffffff; color: #ffffff; }
    .stat-item.red { border: 1px solid #ED2939; color: #ED2939; background: rgba(255, 255, 255, 0.9); }

    .main-container { display: flex; gap: 15px; min-height: 400px; }

    .webcam-section {
      flex: 2;
      display: flex;
      flex-direction: column;
      background: linear-gradient(145deg, #001a3a 0%, #ffffff 50%, #3a0f0f 100%);
      border: 2px solid #ffffff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 38, 84, 0.5);
    }

    .webcam-header {
      padding: 12px;
      background: linear-gradient(90deg, #002654 0%, #ffffff 50%, #ED2939 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .webcam-title { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #ffffff; text-shadow: 2px 2px 0 #002654; font-size: 0.9em; }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0,0,0,0.5);
      padding: 4px 8px;
      border-radius: 30px;
      font-size: 0.75em;
      color: #ffffff;
    }

    .live-dot { width: 8px; height: 8px; background: #ED2939; border-radius: 50%; animation: pulse 1s infinite; }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    .webcam-container { flex: 1; position: relative; background: #000; min-height: 180px; }
    #webcamImage { width: 100%; height: 100%; object-fit: contain; display: none; }

    .loading-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(0,38,84,0.9) 0%, rgba(255,255,255,0.9) 50%, rgba(237,41,57,0.9) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      text-align: center;
      padding: 15px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #ffffff;
      border-top-color: #002654;
      border-right-color: #ED2939;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    .region-logo {
      position: absolute;
      bottom: 60px;
      right: 10px;
      z-index: 20;
      width: 70px;
      opacity: 0.9;
      transition: all 0.3s;
      pointer-events: none;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.8));
      animation: logo-glow 2s infinite alternate;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      padding: 3px;
      backdrop-filter: blur(2px);
    }

    @keyframes logo-glow {
      0% { filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7)); }
      100% { filter: drop-shadow(0 0 10px rgba(255, 255, 255, 1)) drop-shadow(0 0 15px rgba(255, 255, 255, 0.7)); }
    }

    .webcam-info {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      background: linear-gradient(90deg, #002654 0%, transparent 50%, #ED2939 100%);
      padding: 6px 10px;
      border: 1px solid #ffffff;
      border-radius: 5px;
      color: #ffffff;
      font-weight: bold;
      z-index: 15;
      font-size: 0.8em;
      flex-wrap: wrap;
      gap: 5px;
    }

    .webcam-controls {
      padding: 12px;
      background: linear-gradient(145deg, #002654 0%, #ffffff 50%, #ED2939 100%);
      border-top: 1px solid #ffffff;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: transparent;
      border: 2px solid #ffffff;
      color: #ffffff;
      padding: 6px 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8em;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: bold;
      text-shadow: 1px 1px 0 #002654;
      border-radius: 6px;
    }

    .btn:hover { background: #ffffff; color: #002654; border-color: #ED2939; box-shadow: 0 0 20px #ffffff; }

    .sidebar {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: linear-gradient(145deg, #001a3a 0%, #ffffff 50%, #2a0a0a 100%);
      border: 2px solid #ffffff;
      border-radius: 10px;
      overflow: hidden;
      min-width: 280px;
      box-shadow: 0 0 30px rgba(237, 41, 57, 0.3);
    }

    .sidebar-header { padding: 12px; background: linear-gradient(90deg, #002654 0%, #ffffff 50%, #ED2939 100%); }
    .sidebar-header span { color: #ffffff; font-weight: bold; text-shadow: 2px 2px 0 #002654; font-size: 0.9em; }

    .search-box {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #002654;
      color: #002654;
      font-family: inherit;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.8em;
    }

    .search-box::placeholder { color: #ED2939; }

    .category-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 8px;
      background: rgba(0,0,0,0.2);
    }

    .category-btn {
      background: transparent;
      border: 1px solid #ffffff;
      color: #ffffff;
      padding: 4px 6px;
      border-radius: 20px;
      font-size: 0.6em;
      cursor: pointer;
      transition: all 0.3s;
      flex: 1 1 auto;
      min-width: 60px;
    }

    .category-btn:hover { background: #ED2939; border-color: #ED2939; }
    .category-btn.active { background: #002654; border-color: #002654; }

    .sidebar-tabs { display: flex; border-bottom: 2px solid #ffffff; flex-wrap: wrap; }

    .tab {
      flex: 1;
      padding: 10px 3px;
      text-align: center;
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s;
      font-size: 0.75em;
      font-weight: bold;
      text-shadow: 1px 1px 0 #002654;
      min-width: 70px;
    }

    .tab.active { background: linear-gradient(90deg, #002654 0%, #ED2939 100%); color: #ffffff; }

    .tab-content { flex: 1; overflow-y: auto; padding: 12px; max-height: 350px; }

    .webcam-list { display: flex; flex-direction: column; gap: 8px; }

    .webcam-item {
      background: linear-gradient(145deg, rgba(0,38,84,0.1) 0%, rgba(255,255,255,0.2) 50%, rgba(237,41,57,0.1) 100%);
      border: 1px solid #002654;
      padding: 8px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 5px;
      font-size: 0.8em;
    }

    .webcam-item:hover { transform: translateX(-3px); border-color: #ED2939; box-shadow: 0 0 10px #ED2939; }
    .webcam-item.active { border: 2px solid #ED2939; background: linear-gradient(145deg, #002654 0%, #ffffff 50%, #ED2939 100%); }

    .zone-tag { font-size: 0.65em; padding: 2px 5px; background: #002654; color: #ffffff; border-radius: 20px; white-space: nowrap; }

    .incident-list { display: flex; flex-direction: column; gap: 8px; }

    .incident-card {
      background: linear-gradient(145deg, rgba(0,38,84,0.2) 0%, rgba(255,255,255,0.3) 50%, rgba(237,41,57,0.2) 100%);
      border-left: 4px solid;
      padding: 8px;
      cursor: pointer;
      transition: all 0.3s;
      border-radius: 0 5px 5px 0;
      font-size: 0.8em;
    }

    .incident-card.accident { border-left-color: #ED2939; }
    .incident-card.traffic_jam { border-left-color: #FFA500; }
    .incident-card.roadworks { border-left-color: #002654; }
    .incident-card.trafficolor { border-left-color: #00CED1; }
    .incident-card.serious_hazard { border-left-color: #8B0000; }
    .incident-card.hazard { border-left-color: #FF4500; }
    .incident-card.roadclosure { border-left-color: #000000; }
    .incident-card.flood { border-left-color: #00CED1; }
    .incident-card.market { border-left-color: #FFD700; }
    .incident-card.local_event { border-left-color: #9370DB; }
    .incident-card.animal { border-left-color: #8B4513; }

    .incident-card:hover { transform: translateX(-3px); box-shadow: 0 0 10px #ffffff; }

    .incident-title {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #002654;
      font-size: 0.85em;
      flex-wrap: wrap;
    }

    .incident-desc { color: #000000; font-size: 0.8em; margin: 4px 0; line-height: 1.3; }

    .incident-meta {
      display: flex;
      justify-content: space-between;
      color: #ED2939;
      font-size: 0.7em;
      margin-top: 5px;
      font-weight: bold;
      flex-wrap: wrap;
      gap: 5px;
    }

    .incident-source { font-size: 0.6em; color: #002654; margin-top: 4px; font-style: italic; }

    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 15px; }

    .stat-card { background: rgba(255,255,255,0.1); padding: 6px; border-radius: 5px; text-align: center; }
    .stat-number { font-size: 1.1em; font-weight: bold; color: #ED2939; }
    .stat-label { font-size: 0.6em; color: #ffffff; }

    .map-container {
      margin-top: 15px;
      height: 200px;
      border: 3px solid #ffffff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,38,84,0.5);
    }

    #map { height: 100%; width: 100%; }

    .footer {
      margin-top: 15px;
      padding: 8px 15px;
      background: linear-gradient(90deg, #002654 0%, #ffffff 50%, #ED2939 100%);
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #002654;
      font-weight: bold;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.8em;
    }

    .source-item { display: flex; align-items: center; gap: 5px; }
    .source-item a { color: #002654; text-decoration: none; border-bottom: 1px dotted #ED2939; }
    .source-item a:hover { color: #ED2939; }
    .last-update { color: #ED2939; font-weight: bold; }

    @media (max-width: 768px) {
      body { padding: 8px; }
      .main-container { flex-direction: column; height: auto; gap: 12px; }
      .header { flex-direction: column; align-items: stretch; text-align: center; }
      .logo { justify-content: center; }
      .logo h1 { font-size: 1.1em; }
      .stats { justify-content: center; width: 100%; }
      .stat-item { flex: 1; justify-content: center; font-size: 0.7em; }
      .webcam-section { min-height: 250px; }
      .webcam-header { padding: 8px; }
      .webcam-title { font-size: 0.8em; }
      .webcam-container { min-height: 150px; }
      .region-logo { width: 50px; bottom: 50px; }
      .webcam-info { font-size: 0.7em; padding: 5px 8px; }
      .webcam-controls { padding: 8px; gap: 5px; }
      .btn { padding: 5px 8px; font-size: 0.7em; flex: 1 1 auto; justify-content: center; }
      .sidebar { min-width: 100%; }
      .sidebar-header { padding: 8px; }
      .sidebar-header span { font-size: 0.8em; }
      .search-box { padding: 6px; font-size: 0.7em; }
      .category-filters { padding: 6px; gap: 3px; }
      .category-btn { padding: 3px 5px; font-size: 0.55em; min-width: 50px; }
      .tab { padding: 6px 2px; font-size: 0.65em; min-width: 50px; }
      .tab-content { padding: 8px; max-height: 300px; }
      .webcam-item { padding: 6px; font-size: 0.7em; }
      .incident-card { padding: 6px; font-size: 0.7em; }
      .incident-title { font-size: 0.75em; }
      .incident-desc { font-size: 0.7em; }
      .incident-meta { font-size: 0.65em; }
      .map-container { height: 180px; margin-top: 12px; }
      .footer { padding: 6px 10px; font-size: 0.7em; flex-direction: column; text-align: center; }
    }

    @media (max-width: 480px) {
      .stats { flex-direction: column; }
      .stat-item { width: 100%; }
      .btn { width: calc(50% - 3px); }
      .category-btn { min-width: 45px; }
      .tab { font-size: 0.6em; padding: 5px 1px; }
      .region-logo { width: 40px; bottom: 45px; }
    }

    @media (max-width: 360px) {
      .btn { width: 100%; }
      .category-btn { min-width: 40px; font-size: 0.5em; }
      .webcam-title { font-size: 0.7em; }
      .webcam-info { font-size: 0.6em; flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="flag-bar"></div>

  <div class="header">
    <div class="logo">
      <h1>INFOTRAFIC RÉUNION</h1>
      <span class="badge">DIRECT</span>
    </div>
    <div class="stats">
      <div class="stat-item blue">
        <span class="material-icons" style="font-size: 16px;">videocam</span>
        <span id="camCount">0</span>
      </div>
      <div class="stat-item red">
        <span class="material-icons" style="font-size: 16px;">warning</span>
        <span id="incidentCount">0</span>
      </div>
      <div class="stat-item white">
        <span class="material-icons" style="font-size: 16px;">schedule</span>
        <span id="liveTime">--:--</span>
      </div>
    </div>
  </div>

  <div class="main-container">
    <div class="webcam-section">
      <div class="webcam-header">
        <div class="webcam-title">
          <span class="material-icons" style="font-size: 16px;">live_tv</span>
          <span id="webcamName">WEBCAM</span>
        </div>
        <div class="live-indicator">
          <span class="live-dot"></span>
          <span>DIRECT</span>
        </div>
      </div>
      
      <div class="webcam-container">
        <div class="loading-overlay" id="loadingOverlay">
          <div class="spinner"></div>
          <div style="color: #ffffff; font-weight: bold; font-size: 0.9em;">Chargement...</div>
        </div>
        <img id="webcamImage" alt="Webcam D.E.E.R." style="display: none;">
        
        <img src="region-reunion-logo.png" 
             alt="Logo Région Réunion" 
             class="region-logo"
             title="Région Réunion"
             onerror="this.onerror=null; this.src='https://github.com/gunout/Traffic-Routier-D.E.E.R/blob/main/region-reunion-logo.png?raw=true';">
        
        <div class="webcam-info">
          <span id="locationDisplay">Localisation: -</span>
          <span id="zoneDisplay">Zone: -</span>
        </div>
      </div>

      <div class="webcam-controls">
        <button class="btn" id="prevBtn">
          <span class="material-icons" style="font-size: 16px;">chevron_left</span>
          PRÉC
        </button>
        <button class="btn" id="refreshBtn">
          <span class="material-icons" style="font-size: 16px;">refresh</span>
          ACTU
        </button>
        <button class="btn" id="fullscreenBtn">
          <span class="material-icons" style="font-size: 16px;">fullscreen</span>
          PLEIN
        </button>
        <button class="btn" id="nextBtn">
          SUIV
          <span class="material-icons" style="font-size: 16px;">chevron_right</span>
        </button>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-header">
        <div style="display: flex; align-items: center; gap: 5px;">
          <span class="material-icons" style="font-size: 16px;">info</span>
          <span>INFOS TRAFIC</span>
        </div>
        <input type="text" class="search-box" id="searchInput" placeholder="Rechercher...">
      </div>

      <div class="category-filters" id="categoryFilters"></div>

      <div class="sidebar-tabs">
        <button class="tab active" onclick="window.switchTab('incidents')">⚠️ INCID</button>
        <button class="tab" onclick="window.switchTab('stats')">📊 STATS</button>
        <button class="tab" onclick="window.switchTab('webcams')">📹 WEBCAMS</button>
      </div>

      <div class="tab-content" id="tabContent"></div>
    </div>
  </div>

  <div class="map-container">
    <div id="map"></div>
  </div>

  <div class="footer">
    <div class="source-item">
      <span>📹</span>
      <a href="https://www.infotrafic.re" target="_blank">D.E.E.R.</a>
      <span>·</span>
      <span>🌐</span>
      <a href="https://api.openeventdatabase.org/" target="_blank">OpenEventDatabase</a>
    </div>
    <div class="last-update" id="lastUpdate">--:--</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  
  <script>
    (function() {
      'use strict';

      // ============================================

        { id: 'dec_15', name: 'RN1 - La Grande Chaloupe', url: 'https://www.infotrafic.re/CAM/dec_15.jpeg', coords: [-20.9067, 55.3982], zone: 'Nord-Ouest', desc: 'Grande Chaloupe' },
        { id: 'dec_02', name: 'RN1 Le Port - Sacré Cœur', url: 'https://www.infotrafic.re/CAM/dec_02.jpeg', coords: [-20.9367, 55.2961], zone: 'Ouest', desc: 'Le Port' },
        { id: 'dec_16', name: 'RN1 Saint-Paul - Bellemène', url: 'https://www.infotrafic.re/CAM/dec_16.jpeg', coords: [-20.9967, 55.2821], zone: 'Ouest', desc: 'Saint-Paul' },
        { id: 'dec_09', name: 'RN1 Saint-Paul - Tranchée', url: 'https://www.infotrafic.re/CAM/dec_09.jpeg', coords: [-21.0034, 55.2756], zone: 'Ouest', desc: 'Saint-Paul' },
        { id: 'dec_17', name: 'RN1 - Plateau Caillou', url: 'https://www.infotrafic.re/CAM/dec_17.jpeg', coords: [-21.0189, 55.2698], zone: 'Ouest', desc: 'Plateau Caillou' },
        { id: 'dec_18', name: 'RN1 - Éperon', url: 'https://www.infotrafic.re/CAM/dec_18.jpeg', coords: [-21.0312, 55.2645], zone: 'Ouest', desc: 'Éperon' },
        { id: 'dec_10', name: 'RN1 - Ravine 3 Bassins', url: 'https://www.infotrafic.re/CAM/dec_10.jpeg', coords: [-21.0812, 55.2598], zone: 'Ouest', desc: 'Trois Bassins' },
        { id: 'dec_11', name: 'RN1 Saint-Leu - Ravine Fontaine', url: 'https://www.infotrafic.re/CAM/dec_11.jpeg', coords: [-21.1534, 55.2789], zone: 'Ouest', desc: 'Saint-Leu' },
        { id: 'dec_12', name: 'RN1 Saint-Pierre - Pierrefonds', url: 'https://www.infotrafic.re/CAM/dec_12.jpeg', coords: [-21.2867, 55.4212], zone: 'Sud', desc: 'Saint-Pierre' },
        { id: 'dec_13', name: 'RN3 Saint-Pierre - Azalées', url: 'https://www.infotrafic.re/CAM/dec_13.jpeg', coords: [-21.3124, 55.4678], zone: 'Sud', desc: 'Azalées' },
        { id: 'dec_05', name: 'RN2 Saint-Pierre - Anse Les Bas', url: 'https://www.infotrafic.re/CAM/dec_05.jpeg', coords: [-21.3345, 55.4789], zone: 'Sud', desc: 'Anse Les Bas' }
      ];

      // ============================================
      // CATÉGORIES (basées sur les tags OEDB)
      // ============================================
      const CATEGORIES = [
        { id: 'accident', name: 'Accidents', color: '#ED2939', icon: 'warning' },
        { id: 'traffic_jam', name: 'Bouchons', color: '#FFA500', icon: 'traffic' },
        { id: 'roadworks', name: 'Travaux', color: '#002654', icon: 'construction' },
        { id: 'trafficolor', name: 'Trafic', color: '#00CED1', icon: 'speed' },
        { id: 'serious_hazard', name: 'Dangers graves', color: '#8B0000', icon: 'dangerous' },
        { id: 'hazard', name: 'Dangers', color: '#FF4500', icon: 'warning' },
        { id: 'roadclosure', name: 'Fermetures', color: '#000000', icon: 'block' },
        { id: 'flood', name: 'Inondations', color: '#00CED1', icon: 'water' },
        { id: 'market', name: 'Marchés', color: '#FFD700', icon: 'shopping_cart' },
        { id: 'local_event', name: 'Événements', color: '#9370DB', icon: 'event' },
        { id: 'animal', name: 'Animaux', color: '#8B4513', icon: 'pets' }
      ];

      // ============================================
      // ÉTAT
      // ============================================
      let currentIndex = 0;
      let map = null;
      let markers = [];
      let incidentMarkers = [];
      let allIncidents = {};
      let webcamInterval = null;

      const elements = {
        webcamImage: document.getElementById('webcamImage'),
        loadingOverlay: document.getElementById('loadingOverlay'),
        webcamName: document.getElementById('webcamName'),
        locationDisplay: document.getElementById('locationDisplay'),
        zoneDisplay: document.getElementById('zoneDisplay'),
        camCount: document.getElementById('camCount'),
        incidentCount: document.getElementById('incidentCount'),
        liveTime: document.getElementById('liveTime'),
        lastUpdate: document.getElementById('lastUpdate'),
        prevBtn: document.getElementById('prevBtn'),
        nextBtn: document.getElementById('nextBtn'),
        refreshBtn: document.getElementById('refreshBtn'),
        fullscreenBtn: document.getElementById('fullscreenBtn'),
        searchInput: document.getElementById('searchInput'),
        tabContent: document.getElementById('tabContent'),
        categoryFilters: document.getElementById('categoryFilters')
      };

      // ============================================
      // FETCH
      // ============================================
      async function apiFetch(url, options = {}) {
        try {
          const response = await fetch(url, {
            ...options,
            headers: { 'Accept': 'application/json', ...options.headers }
          });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return await response.json();
        } catch (error) {
          console.warn('Échec fetch ' + url + ':', error.message);
          return null;
        }
      }

      // ============================================
      // CHARGEMENT DES DONNÉES (TOUS LES CHAMPS OEDB)
      // ============================================
      async function loadAllData() {
        try {
          const url = OEDB_API + '?bbox=' + REUNION_BBOX + '&when=now&limit=500';
          const data = await apiFetch(url);
          
          if (!data || !data.features) {
            elements.lastUpdate.textContent = 'Hors ligne';
            return;
          }
          
          allIncidents = {};
          CATEGORIES.forEach(cat => { allIncidents[cat.id] = []; });
          
          let incidentCount = 0;
          
          data.features.forEach(event => {
            const props = event.properties || {};
            const geom = event.geometry;
            
            // === Extraction complète des coordonnées ===
            let lat = -21.1151, lng = 55.5364;
            let lineCoords = null;
            let polygonCoords = null;
            
            if (geom) {
              if (geom.type === 'Point' && geom.coordinates) {
                lng = geom.coordinates[0];
                lat = geom.coordinates[1];
              } else if (geom.type === 'LineString' && geom.coordinates && geom.coordinates.length > 0) {
                const mid = Math.floor(geom.coordinates.length / 2);
                lng = geom.coordinates[mid][0];
                lat = geom.coordinates[mid][1];
                lineCoords = geom.coordinates.map(c => [c[1], c[0]]);
              } else if (geom.type === 'Polygon' && geom.coordinates && geom.coordinates[0] && geom.coordinates[0].length > 0) {
                const mid = Math.floor(geom.coordinates[0].length / 2);
                lng = geom.coordinates[0][mid][0];
                lat = geom.coordinates[0][mid][1];
                polygonCoords = geom.coordinates[0].map(c => [c[1], c[0]]);
              }
            }
            
            // === Mapping complet des catégories OEDB ===
            let category = 'trafficolor';
            const what = (props.what || '').toLowerCase();
            
            if (what.includes('accident')) category = 'accident';
            else if (what.includes('jam') || what.includes('congestion') || what.includes('bouchon')) category = 'traffic_jam';
            else if (what.includes('roadwork') || what.includes('construction') || what.includes('travaux') || what.includes('chantier')) category = 'roadworks';
            else if (what.includes('serious') || what.includes('grave')) category = 'serious_hazard';
            else if (what.includes('hazard') || what.includes('danger') || what.includes('obstacle')) category = 'hazard';
            else if (what.includes('closure') || what.includes('closed') || what.includes('ferm')) category = 'roadclosure';
            else if (what.includes('flood') || what.includes('inondation')) category = 'flood';
            else if (what.includes('market') || what.includes('marché')) category = 'market';
            else if (what.includes('event') || what.includes('événement') || what.includes('manifestation')) category = 'local_event';
            else if (what.includes('animal')) category = 'animal';
            
            // === Extraction de TOUS les champs possibles ===
            const startDate = props.start ? new Date(props.start) : new Date();
            const timeStr = startDate.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            const dateStr = startDate.toLocaleDateString('fr-FR');
            
            // Nom de route depuis les tags OSM
            let roadName = '';
            if (props.tags) {
              roadName = props.tags.ref || props.tags.name || props.tags.highway || '';
            }
            if (!roadName && props.label) {
              const match = props.label.match(/(RN\d+|RD\d+|N\d+)/i);
              if (match) roadName = match[0];
            }
            
            // Description enrichie
            let description = props.description || '';
            if (!description && props.what) description = props.what;
            if (props.speed) description += ' | ' + props.speed + ' km/h';
            
            if (allIncidents[category]) {
              allIncidents[category].push({
                title: props.label || props.what || 'Incident',
                description: description,
                location: props.location_name || props.address || roadName || 'La Réunion',
                road: roadName,
                time: timeStr,
                date: dateStr,
                start: startDate,
                lastUpdate: props.lastupdate ? new Date(props.lastupdate) : null,
                coordinates: [lat, lng],
                lineCoords: lineCoords,
                polygonCoords: polygonCoords,
                source: props.source || 'OpenEventDatabase',
                what: props.what || '',
                speed: props.speed || null,
                raw: props
              });
              incidentCount++;
            }
          });
          
          elements.incidentCount.textContent = incidentCount;
          elements.lastUpdate.textContent = new Date().toLocaleTimeString('fr-FR', { 
            hour: '2-digit', minute: '2-digit' 
          });
          
          updateIncidentMarkers();
          
          const activeTab = document.querySelector('.tab.active');
          if (activeTab && activeTab.textContent.includes('INCID')) {
            displayAllIncidents();
          }
          
        } catch (error) {
          console.error('Erreur chargement OEDB:', error);
          elements.lastUpdate.textContent = 'Erreur';
        }
      }

      // ============================================
      // WEBCAM
      // ============================================
      function loadWebcam(index) {
        const cam = WEBCAMS[index];
        if (!cam) return;

        currentIndex = index;
        
        elements.webcamName.textContent = cam.name.substring(0, 20) + '...';
        elements.locationDisplay.textContent = '📍 ' + cam.desc;
        elements.zoneDisplay.textContent = 'Zone: ' + cam.zone;
        elements.loadingOverlay.style.display = 'flex';
        elements.webcamImage.style.display = 'none';

        const imageUrl = cam.url + '?t=' + Date.now();
        
        const img = new Image();
        img.onload = () => {
          elements.webcamImage.src = imageUrl;
          elements.webcamImage.style.display = 'block';
          elements.loadingOverlay.style.display = 'none';
          if (map) map.setView(cam.coords, 13);
          if (markers[index]) markers[index].openPopup();
        };

        img.onerror = () => {
          elements.loadingOverlay.innerHTML = 
            '<div style="text-align:center;">' +
              '<span class="material-icons" style="font-size:36px; color:#ED2939;">videocam_off</span>' +
              '<p style="margin-top:5px; color:#ffffff; font-size:0.8em;">Indisponible</p>' +
              '<button onclick="loadWebcam(' + index + ')" style="margin-top:5px; padding:3px 8px; background:#002654; color:white; border:1px solid white; cursor:pointer; font-size:0.7em;">Réessayer</button>' +
            '</div>';
        };

        img.src = imageUrl;
      }

      // ============================================
      // FILTRES & AFFICHAGE
      // ============================================
      function createCategoryFilters() {
        let html = '';
        CATEGORIES.forEach(cat => {
          html += '<button class="category-btn" onclick="filterByCategory(\'' + cat.id + '\')">' + cat.name + '</button>';
        });
        elements.categoryFilters.innerHTML = html;
      }

      window.filterByCategory = function(category) {
        const incidents = allIncidents[category] || [];
        if (incidents.length > 0) {
          displayIncidentsByCategory(category, incidents);
        } else {
          elements.tabContent.innerHTML = '<div style="text-align: center; padding: 15px; color: #ED2939; font-size:0.8em;">Aucun incident</div>';
        }
        document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');
      };

      function displayAllIncidents() {
        let html = '<div class="incident-list">';
        let total = 0;
        
        Object.keys(allIncidents).forEach(key => {
          const incidents = allIncidents[key];
          if (Array.isArray(incidents) && incidents.length > 0) {
            const cat = CATEGORIES.find(c => c.id === key) || { 
              id: key, name: key.replace('_', ' '), color: '#888', icon: 'info' 
            };
            
            incidents.forEach(inc => {
              total++;
              html += renderIncidentCard(inc, cat);
            });
          }
        });
        
        if (total === 0) {
          html += '<div style="text-align: center; padding: 15px; color: #ED2939; font-size:0.8em;">Aucun incident</div>';
        }
        
        html += '</div>';
        elements.tabContent.innerHTML = html;
      }

      function displayIncidentsByCategory(categoryId, incidents) {
        const cat = CATEGORIES.find(c => c.id === categoryId);
        let html = '<h3 style="color: ' + cat.color + '; margin-bottom: 10px; font-size:0.8em;">' + cat.name + '</h3>';
        html += '<div class="incident-list">';
        incidents.forEach(inc => { html += renderIncidentCard(inc, cat); });
        html += '</div>';
        elements.tabContent.innerHTML = html;
      }

      function renderIncidentCard(inc, cat) {
        let desc = inc.description || '';
        if (inc.speed) desc += ' | ' + inc.speed + ' km/h';
        if (desc.length > 80) desc = desc.substring(0, 80) + '…';
        
        let sourceLine = 'Source: ' + inc.source;
        if (inc.what && inc.what !== inc.source) sourceLine += ' · ' + inc.what;
        
        return '' +
          '<div class="incident-card ' + cat.id + '" onclick="focusLocation(' + inc.coordinates[0] + ', ' + inc.coordinates[1] + ')">' +
            '<div class="incident-title">' +
              '<span class="material-icons" style="font-size:16px;">' + cat.icon + '</span>' +
              escapeHtml(inc.title || 'Incident') +
            '</div>' +
            (desc ? '<div class="incident-desc">' + escapeHtml(desc) + '</div>' : '') +
            '<div class="incident-meta">' +
              '<span>📍 ' + escapeHtml(inc.location || 'La Réunion') + '</span>' +
              '<span>🕒 ' + escapeHtml(inc.time || '') + '</span>' +
            '</div>' +
            '<div class="incident-source">' + escapeHtml(sourceLine) + '</div>' +
          '</div>';
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function displayStats() {
        const total = Object.values(allIncidents).reduce((sum, arr) => sum + arr.length, 0);
        
        let html = '<div class="stats-grid">';
        CATEGORIES.forEach(cat => {
          const count = (allIncidents[cat.id] || []).length;
          if (count > 0) {
            html += 
              '<div class="stat-card" style="border-left: 3px solid ' + cat.color + ';">' +
                '<div class="stat-number">' + count + '</div>' +
                '<div class="stat-label">' + cat.name.substring(0, 8) + '</div>' +
              '</div>';
          }
        });
        html += '</div>';
        
        if (total === 0) {
          html = '<div style="text-align:center; padding:15px; color:#ED2939;">Aucun incident signalé</div>';
        } else {
          html += '<div style="text-align: center; margin-top: 10px;">' +
            '<span style="color: #ED2939; font-size: 0.9em;">Total: ' + total + ' incidents</span>' +
          '</div>';
        }
        
        elements.tabContent.innerHTML = html;
      }

      // ============================================
      // CARTE (CartoDB Dark Matter - SANS API KEY)
      // ============================================
      function initMap() {
        map = L.map('map', {
          center: [-21.1151, 55.5364],
          zoom: 10,
          zoomControl: false,
          attributionControl: false
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          subdomains: 'abcd',
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        WEBCAMS.forEach((cam, index) => {
          const marker = L.marker(cam.coords, {
            icon: L.divIcon({
              className: 'map-marker',
              html: '<div style="background: linear-gradient(135deg, #002654 0%, #ffffff 50%, #ED2939 100%); width: 10px; height: 10px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 8px #ffffff;"></div>',
              iconSize: [10, 10]
            })
          }).addTo(map);

          marker.bindPopup('<b>📹 ' + cam.desc + '</b><br>' + cam.zone);
          marker.on('click', () => {
            currentIndex = index;
            loadWebcam(currentIndex);
          });

          markers.push(marker);
        });
      }

      function updateIncidentMarkers() {
        if (!map) return;
        
        if (incidentMarkers.length > 0) {
          incidentMarkers.forEach(marker => map.removeLayer(marker));
          incidentMarkers = [];
        }

        let totalMarkers = 0;

        Object.keys(allIncidents).forEach(key => {
          const incidents = allIncidents[key];
          if (Array.isArray(incidents) && incidents.length > 0) {
            const cat = CATEGORIES.find(c => c.id === key) || { 
              id: key, color: '#888', icon: 'info', name: key 
            };
            
            incidents.forEach(inc => {
              if (!inc.coordinates || inc.coordinates.length !== 2) return;
              const [lat, lng] = inc.coordinates;
              if (isNaN(lat) || isNaN(lng)) return;
              
              const markerColor = cat.color;
              
              let popupContent = '<b style="color: ' + cat.color + ';">' + escapeHtml(cat.name) + '</b><br>';
              popupContent += '<strong>' + escapeHtml(inc.title) + '</strong><br>';
              if (inc.description) popupContent += escapeHtml(inc.description) + '<br>';
              if (inc.road) popupContent += '🛣️ ' + escapeHtml(inc.road) + '<br>';
              popupContent += '📍 ' + escapeHtml(inc.location) + '<br>';
              popupContent += '🕒 ' + escapeHtml(inc.time) + ' ' + escapeHtml(inc.date || '');
              if (inc.source) popupContent += '<br><small>Source: ' + escapeHtml(inc.source) + '</small>';
              
              if (inc.lineCoords && inc.lineCoords.length > 1) {
                const polyline = L.polyline(inc.lineCoords, {
                  color: markerColor,
                  weight: 4,
                  opacity: 0.7,
                  dashArray: '8, 8'
                }).addTo(map);
                polyline.bindPopup(popupContent);
                incidentMarkers.push(polyline);
                totalMarkers++;
              } else if (inc.polygonCoords && inc.polygonCoords.length > 2) {
                const polygon = L.polygon(inc.polygonCoords, {
                  color: markerColor,
                  fillColor: markerColor,
                  fillOpacity: 0.2,
                  weight: 2
                }).addTo(map);
                polygon.bindPopup(popupContent);
                incidentMarkers.push(polygon);
                totalMarkers++;
              } else {
                const marker = L.marker([lat, lng], {
                  icon: L.divIcon({
                    className: 'map-marker',
                    html: '<span class="material-icons" style="color: ' + markerColor + '; font-size: 18px; filter: drop-shadow(0 0 8px ' + markerColor + ');">' + cat.icon + '</span>',
                    iconSize: [18, 18]
                  })
                }).addTo(map);
                marker.bindPopup(popupContent);
                incidentMarkers.push(marker);
                totalMarkers++;
              }
            });
          }
        });
        
        console.log('🗺️ ' + totalMarkers + ' éléments sur la carte');
      }

      // ============================================
      // NAVIGATION
      // ============================================
      function nextCamera() {
        currentIndex = (currentIndex + 1) % WEBCAMS.length;
        loadWebcam(currentIndex);
      }

      function prevCamera() {
        currentIndex = (currentIndex - 1 + WEBCAMS.length) % WEBCAMS.length;
        loadWebcam(currentIndex);
      }

      window.selectWebcam = function(index) {
        currentIndex = index;
        loadWebcam(currentIndex);
        displayWebcamsList();
      };

      window.focusLocation = function(lat, lng) {
        if (map) map.setView([lat, lng], 14);
      };

      window.switchTab = function(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');
        
        if (tab === 'incidents') displayAllIncidents();
        else if (tab === 'stats') displayStats();
        else displayWebcamsList();
      };

      function displayWebcamsList() {
        let html = '<div class="webcam-list">';
        WEBCAMS.forEach((cam, index) => {
          html += 
            '<div class="webcam-item ' + (index === currentIndex ? 'active' : '') + '" onclick="selectWebcam(' + index + ')">' +
              '<div>' +
                '<div><strong style="color: #002654;">' + escapeHtml(cam.desc) + '</strong></div>' +
                '<div style="font-size:0.7em; color:#ED2939; margin-top:3px;">' + escapeHtml(cam.zone) + '</div>' +
              '</div>' +
              '<span class="zone-tag">' + escapeHtml(cam.zone) + '</span>' +
            '</div>';
        });
        html += '</div>';
        elements.tabContent.innerHTML = html;
      }

      // ============================================
      // HORLOGE
      // ============================================
      function startClock() {
        function update() {
          const now = new Date();
          elements.liveTime.textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }
        update();
        setInterval(update, 1000);
      }

      // ============================================
      // RECHERCHE
      // ============================================
      function setupSearch() {
        elements.searchInput.addEventListener('input', (e) => {
          const search = e.target.value.toLowerCase();
          const activeTab = document.querySelector('.tab.active');
          
          if (activeTab && activeTab.textContent.includes('WEBCAMS')) {
            const filtered = WEBCAMS.filter(cam => 
              cam.desc.toLowerCase().includes(search) || 
              cam.zone.toLowerCase().includes(search)
            );
            
            let html = '<div class="webcam-list">';
            filtered.forEach((cam) => {
              const originalIndex = WEBCAMS.findIndex(c => c.id === cam.id);
              html += 
                '<div class="webcam-item ' + (originalIndex === currentIndex ? 'active' : '') + '" onclick="selectWebcam(' + originalIndex + ')">' +
                  '<div>' +
                    '<div><strong style="color: #002654;">' + escapeHtml(cam.desc) + '</strong></div>' +
                    '<div style="font-size:0.7em; color:#ED2939; margin-top:3px;">' + escapeHtml(cam.zone) + '</div>' +
                  '</div>' +
                  '<span class="zone-tag">' + escapeHtml(cam.zone) + '</span>' +
                '</div>';
            });
            html += '</div>';
            elements.tabContent.innerHTML = html;
          }
        });
      }

      // ============================================
      // EVENTS
      // ============================================
      function setupEvents() {
        elements.prevBtn.addEventListener('click', prevCamera);
        elements.nextBtn.addEventListener('click', nextCamera);
        elements.refreshBtn.addEventListener('click', () => loadWebcam(currentIndex));
        
        elements.fullscreenBtn.addEventListener('click', () => {
          const container = document.querySelector('.webcam-section');
          if (container.requestFullscreen) container.requestFullscreen();
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft') prevCamera();
          if (e.key === 'ArrowRight') nextCamera();
          if (e.key === ' ' || e.key === 'Space') {
            e.preventDefault();
            loadWebcam(currentIndex);
          }
        });

        setupSearch();
      }

      // ============================================
      // RAFRAÎCHISSEMENT WEBCAM OPTIMISÉ
      // ============================================
      function setupWebcamRefresh() {
        const webcamSection = document.querySelector('.webcam-section');
        
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              if (!webcamInterval) {
                webcamInterval = setInterval(() => loadWebcam(currentIndex), 15000);
              }
            } else {
              if (webcamInterval) {
                clearInterval(webcamInterval);
                webcamInterval = null;
              }
            }
          });
        }, { threshold: 0.3 });
        
        observer.observe(webcamSection);
      }

      // ============================================
      // INITIALISATION
      // ============================================
      async function init() {
        elements.camCount.textContent = WEBCAMS.length;
        
        initMap();
        loadWebcam(0);
        startClock();
        setupEvents();
        setupWebcamRefresh();
        displayWebcamsList();
        createCategoryFilters();
        
        await loadAllData();
        setInterval(loadAllData, 60000);
      }

      document.addEventListener('DOMContentLoaded', init);
      
    })();
  </script>
</body>
</html>
